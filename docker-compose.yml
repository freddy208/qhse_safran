version: "3.9"

# ── PRODUCTION / PILOTE (Neon externe) ────────────────────────────────────
# Base de données : Neon (variable DATABASE_URL dans .env)
# Démarrage       : docker compose up -d --build
# Domaine HTTPS   : renseigner Caddyfile avant le build

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}       # Neon connection string
      JWT_SECRET:   ${JWT_SECRET}         # 32+ caractères aléatoires
      PORT:         "4000"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-*}
    networks:
      - qhse-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout:   10s
      retries:   3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - qhse-net
    depends_on:
      - backend

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - qhse-net
    depends_on:
      - frontend
      - backend

  # ── PostgreSQL LOCAL (désactivé par défaut — phase pilote avec Neon) ─────
  # Pour passer en auto-hébergé, décommentez ce bloc ET modifiez DATABASE_URL
  # pour pointer vers ce conteneur : postgresql://qhse:SECRET@db:5432/qhse
  #
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB:       qhse
  #     POSTGRES_USER:     qhse
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - qhse-net
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U qhse"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  qhse-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  # postgres_data:   # décommenter avec le bloc db ci-dessus
