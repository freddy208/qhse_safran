version: "3.9"

# ── DÉVELOPPEMENT LOCAL (HTTP seulement, Neon ou Postgres local) ──────────
# Utilisation : docker compose -f docker-compose.local.yml up --build
# Accès        : http://localhost:3000 (frontend) / http://localhost:4000 (backend)

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET:   ${JWT_SECRET}
      PORT:         "4000"
      FRONTEND_ORIGIN: "http://localhost:3000"
    networks:
      - qhse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - qhse-net
    depends_on:
      - backend

  # ── PostgreSQL local (optionnel — peut être remplacé par Neon) ─────────
  # db:
  #   image: postgres:16-alpine
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_DB:       qhse
  #     POSTGRES_USER:     qhse
  #     POSTGRES_PASSWORD: localdevpassword
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - qhse-net

networks:
  qhse-net:
    driver: bridge

